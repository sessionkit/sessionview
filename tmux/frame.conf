# frame.conf — tmux options for sessionview sessions only: the tab bar is at
# the top here, and every other session keeps its own. A shell snippet, not a tmux
# conf: sessionview-frame and -session source it with $S = the session name;
# every line is a SESSION-scoped set (no -g), so main and every other session
# keep the global config. Same look as tabs-top.conf (herdr Mocha palette), plus
# status-style set HERE because tmux-theme-apply runs backgrounded from
# ~/.tmux.conf and repaints the global status-style light AFTER tabs-top
# loaded — that was the white block right of the "+" (measured).
# A session option outranks the global one, so the race cannot reach it.
: "${SESSIONVIEW_ROOT:?frame.conf is sourced with S=<session> and SESSIONVIEW_ROOT=<checkout>}"
tmux set -t "$S" status on
tmux set -t "$S" status-position top
# THE TAB X IS ON BY DEFAULT AGAIN, as a faint grey x. It was removed once and
# put back as it was before. The glyph
# and its binding never left - they were gated behind this option, default
# off. The off switch is unchanged: `tmux set -g @sessionview_tab_close 0`, because
# tmux reads "0" and empty as false in #{?...}.
tmux set -t "$S" @sessionview_tab_close 1
tmux set -t "$S" status-style "bg=#181924,fg=#a6aec7"
tmux set -t "$S" status-format[0] "#[align=left bg=#181924 fg=#7f859b]#[range=user|sidebar fg=#5c6072] ◧ #[norange fg=#7f859b]#{W:#[range=window|#{window_index} bg=#313343 fg=#7f859b] #{?#{@sessionview_glyph},#[fg=#{@sessionview_glyph_fg}]#{@sessionview_glyph}#[fg=#7f859b] ,}#{?#{==:#{window_name},#{b:default-shell}},#{window_index},#{window_name}} #[norange]#{?@sessionview_tab_close,#[range=user|close-#{window_index} fg=#5c6072]×#[norange fg=#7f859b] ,}#[bg=#181924] ,#[range=window|#{window_index} bg=#8cb7f6 fg=#181924 bold] #{?#{@sessionview_glyph},#[fg=#{@sessionview_glyph_fg}]#{@sessionview_glyph}#[fg=#181924] ,}#{?#{==:#{window_name},#{b:default-shell}},#{window_index},#{window_name}} #[norange]#{?@sessionview_tab_close,#[range=user|close-#{window_index} fg=#3b4a66]×#[norange fg=#181924] ,}#[nobold bg=#181924] }#[range=right bg=#181924 fg=#7f859b bold] + #[norange nobold]"
# The bar looks like herdr's: the CLOCK is gone from the right and the SESSION
# NAME from the left - herdr's bar is tabs and a "+", nothing else. The sidebar
# names the project, so the bar does not have to. Colours are sampled from a
# herdr screenshot (bar #181924, selected tab #8cb7f6 on #181924, unselected
# #313343 / #7f859b).
# Tab label: the NAME once the window is named, the NUMBER until then -
# herdr's behaviour. With automatic-rename off in the user's config, an
# unnamed window carries the shell's basename; that is the tell.
# Key bindings are server-wide in tmux; this one is harmless elsewhere
# (a click on the far right of any status bar pops the new-tab box).
# -h 14: the box is the sidebar's new-tab PICKER (four rows of chrome, then the
# configured windows; 6 shipped), shown in the main part of the window.
tmux bind -n MouseDown1StatusRight display-popup -E -w 44 -h 14 -d "#{pane_current_path}" "$SESSIONVIEW_ROOT/bin/sessionview-newtab --popup '#{pane_current_path}'"
# A window that holds an agent shows the agent-list glyph in its tab, where the
# eye goes. tmux-sidebar writes the
# window options @sessionview_glyph / @sessionview_glyph_fg (rollup of the seats in that
# window, blocked < busy < idle < shell) and this format reads them; no sidebar
# running = no glyphs, and the sidebar clears its own on exit.

# Drag-to-reorder tabs. tmux can do it: press selects the tab under the mouse
# (MouseDown1Status), and
# every drag event swaps the ACTIVE window with the one under the mouse. -d is
# what keeps the dragged window active as it moves -- measured:
# without -d the active INDEX stays put and the dragged tab slips out from
# under the marker; with -d it rides along. Server-wide, harmless elsewhere.
# Dragging past the last tab onto "+" briefly shows tmux's "can't find window".
tmux bind -n MouseDrag1Status swap-window -d -t=

# POPUP MODE: prefix H
# floats the sidebar over the current client - click a project or agent, it
# switches and the popup closes. For the terminals that are not the sessionview
# window. Server-wide binding, like the two above.
tmux bind H display-popup -E -x 0 -y 0 -w 36 -h 100% "$SESSIONVIEW_ROOT/bin/tmux-sidebar --popup"
# TAB CLOSE: a little x that closes the tab. tmux has no hover, so the x is
# always there, dim, at the end of
# every tab: a user range close-N; a click inside it kills window N, a click
# anywhere else on the tab selects it as before. run-shell expands the format.
# On by default again; it was off for a while because it adds a little
# space. The x exists only while @sessionview_tab_close is 1 (set above);
# `tmux set -g @sessionview_tab_close 0` turns it off.
# No -t = on the if-shell: an x is a USER range, there is no window under the
# mouse there, and -t = aborted the whole command (measured on a first click).
# (a SHELL line: each tmux argument is one quoted word, no brace blocks)
# The glyph at the FAR LEFT of the bar (user range "sidebar") hides the
# sidebar, or shows it again. The
# toggle runs on the INNER server; it finds the frame by the clicking
# client's tty (#{client_tty} expands in the binding), so several frames
# on one session each toggle their own. Tested first, else the tab/close
# chain below. stdout goes to /dev/null: run-shell paints a command's
# output OVER the pane until a key is pressed, and "sidebar shown (41
# columns)" replaced the user's git window; the window's content must not be
# replaced. stderr is
# kept: a refusal should still be seen.
tmux bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},sidebar}' "run-shell \"'$SESSIONVIEW_ROOT/bin/sessionview-sidebar-toggle' --tty '#{client_tty}' >/dev/null\"" "if-shell -F '#{m/r:^close-,#{mouse_status_range}}' \"run-shell \\\"tmux kill-window -t ':#{s/close-//:mouse_status_range}'\\\"\" 'switch-client -t ='"
