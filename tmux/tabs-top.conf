# tabs-top.conf — herdr-style tab bar at the TOP of every tmux session.
# Boxes per window (current lit blue), [+] on the right = new window,
# status-right (mpv, clock) kept. Catppuccin MOCHA palette to match herdr
# 0.8.2's own tab bar (read live, headless capture:
# panel_bg #1e1e2e, active tab bg #89b4fa/fg #181825, inactive
# tab fg #6c7086 dim on surface0 #313244, "+" fg #7f849c on mantle #181825,
# text #cdd6f4). Was Latte (light); this replaces it 1:1, same structure.
# OPTIONAL and
# GLOBAL: sessionview itself gives every session it attaches, creates or
# jumps to this look session-scoped (tmux/frame.conf), so nobody needs this
# file; to have the look in EVERY tmux session, add to ~/.tmux.conf:
#     source-file /path/to/sessionview/tmux/tabs-top.conf   (your checkout)
# Revert live:  tmux source ~/.tmux.conf   (and unbind MouseDown1StatusRight)
set -g status on
set -g status-position top
# The tab X, on by default again. Off
# switch: `set -g @sessionview_tab_close 0`.
set -g @sessionview_tab_close 1
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-format[0] "#[align=left bg=#1e1e2e fg=#6c7086] #[bold]#{session_name}#[nobold]  #{W:#[range=window|#{window_index} bg=#313244 fg=#6c7086 dim] #{?#{@sessionview_glyph},#[fg=#{@sessionview_glyph_fg}]#{@sessionview_glyph}#[fg=#6c7086] ,}#{window_index} #{window_name} #[norange]#{?@sessionview_tab_close,#[range=user|close-#{window_index} fg=#585b70]×#[norange fg=#6c7086] ,}#[nodim bg=#1e1e2e] ,#[range=window|#{window_index} bg=#89b4fa fg=#181825 bold] #{?#{@sessionview_glyph},#[fg=#{@sessionview_glyph_fg}]#{@sessionview_glyph}#[fg=#181825] ,}#{window_index} #{window_name} #[norange]#{?@sessionview_tab_close,#[range=user|close-#{window_index} fg=#3b4a66]×#[norange fg=#181825] ,}#[nobold bg=#1e1e2e] }#[range=right bg=#181825 fg=#7f849c bold] + #[norange nobold fg=#cdd6f4 bg=#1e1e2e]#[align=right]#{T:status-right} "
bind -n MouseDown1StatusRight new-window -c "#{pane_current_path}"
# #{@sessionview_glyph}/#{@sessionview_glyph_fg} are WINDOW options written by tmux-sidebar (see frame.conf).

# Drag a tab to reorder (see frame.conf for the measurement).
bind -n MouseDrag1Status swap-window -d -t=
# TAB CLOSE: a little x that closes the tab. tmux has no hover, so the x is
# always there, dim, at the end of
# every tab: a user range close-N; a click inside it kills window N, a click
# anywhere else on the tab selects it as before. run-shell expands the format.
# On by default again; it was off for a while because it adds a little
# space. The x exists only while @sessionview_tab_close is 1 (set above);
# `tmux set -g @sessionview_tab_close 0` turns it off.
# No -t = on the if-shell: an x is a USER range, there is no window under the
# mouse there, and -t = aborted the whole command (measured on a first click).
bind -n MouseDown1Status if-shell -F "#{m/r:^close-,#{mouse_status_range}}" { run-shell "tmux kill-window -t ':#{s/close-//:mouse_status_range}'" } { switch-client -t = }
