# agent-menu.conf - the agent pane menu. Right-click an agent's pane for
#   Speak / Continue / Read Clipboard / Park / Succeed -> <agent>
# above tmux's own pane menu. Each item mails that agent (bin/tmux-send-agent,
# sessionmail's `message send`). Items appear only when the pane title
# carries an agent address; other panes get tmux's plain menu.
#
# OPT-IN, because a key binding is global to the tmux server: loading this
# REPLACES your own right-click (MouseDown3Pane) menu.
#   - with session view:    sessionview-config set pane_menu true
#                           (sessionview-frame sources this at every launch)
#   - tmux alone:           add to ~/.tmux.conf, then reload (source-file):
#                             source-file -q /path/to/sessionview/tmux/agent-menu.conf
# The sender is you: config mail_from, else $USER (see bin/sessionview-from).
#
# Moved here from a personal ~/.tmux.conf, so that it ships with sessionview.
# The default items are tmux 3.7b's `list-keys -T root MouseDown3Pane`; re-copy
# them if tmux's default changes.

# The helper sits beside this file's directory, wherever it is installed.
# First the path as sourced; then, since a conf.d LINK to this file would
# point that at confd/../bin (found in review), the
# link is resolved in the shell and the option overwritten with the real one.
set -gF @sessionview_agent_menu_conf "#{current_file}"
set -gF @sessionview_agent_menu_bin "#{d:current_file}/../bin/tmux-send-agent"
run-shell 'f="$(realpath "#{@sessionview_agent_menu_conf}" 2>/dev/null)" && [ -n "$f" ] && tmux set -g @sessionview_agent_menu_bin "$(dirname "$f")/../bin/tmux-send-agent"; true'

bind-key -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Speak → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" S { run-shell -b "'#{@sessionview_agent_menu_bin}' #{pane_id}" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Continue → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" C { run-shell -b "'#{@sessionview_agent_menu_bin}' #{pane_id} continue" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Read Clipboard → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" B { run-shell -b "'#{@sessionview_agent_menu_bin}' #{pane_id} -- 'please read the clipboard (pbpaste) and act on it'" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Park → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" P { run-shell -b "'#{@sessionview_agent_menu_bin}' #{pane_id} 'please settle your context, then park'" } \
  "#{?#{m/r:^[^ ]+ ([a-z_][a-z0-9_+-]*[.][^ ]+|[a-z][a-z0-9_-]*:[^ ]+)$,#{pane_title}},Succeed → #{s/[^A-Za-z0-9_.+-].*//:#{s/^[^ ]+ //:pane_title}},}" U { run-shell -b "'#{@sessionview_agent_menu_bin}' #{pane_id} -- 'please settle your context, then succeed: start your successor'" } \
  "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
